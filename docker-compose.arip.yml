services:
  arip-postgres:
    image: postgres:16-alpine
    container_name: arip-postgres
    environment:
      POSTGRES_USER: arip
      POSTGRES_PASSWORD: arip
      POSTGRES_DB: arip
    ports:
      - "5432:5432"
    volumes:
      - arip-postgres-data:/var/lib/postgresql/data
      - ./arip/infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - arip-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arip -d arip"]
      interval: 10s
      timeout: 5s
      retries: 5

  arip-redis:
    image: redis:7-alpine
    container_name: arip-redis
    ports:
      - "6379:6379"
    volumes:
      - arip-redis-data:/data
    networks:
      - arip-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  arip-mosquitto:
    image: eclipse-mosquitto:2
    container_name: arip-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./arip/infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - arip-mosquitto-data:/mosquitto/data
      - arip-mosquitto-logs:/mosquitto/log
    networks:
      - arip-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t 'healthcheck' -m 'ping' && echo ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  arip-minio:
    image: minio/minio:latest
    container_name: arip-minio
    command: server /data --console-address ":9002"
    environment:
      MINIO_ROOT_USER: arip_minio
      MINIO_ROOT_PASSWORD: arip_minio_secret
    ports:
      - "9000:9000"
      - "9002:9002"
    volumes:
      - arip-minio-data:/data
    networks:
      - arip-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  arip-nodered:
    image: nodered/node-red:3-minimal
    container_name: arip-nodered
    ports:
      - "1880:1880"
    environment:
      - NODE_RED_ENABLE_PROJECTS=false
    volumes:
      - ./arip/infra/nodered/data:/data
    networks:
      - arip-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1880/"]
      interval: 15s
      timeout: 5s
      retries: 5

  arip-backend:
    build:
      context: ./arip/backend
      dockerfile: Dockerfile
    container_name: arip-backend
    ports:
      - "3001:3001"
    env_file:
      - .env.arip
    environment:
      DATABASE_URL: postgresql://arip:arip@arip-postgres:5432/arip
      REDIS_URL: redis://arip-redis:6379
      MQTT_BROKER_URL: mqtt://arip-mosquitto:1883
      MINIO_ENDPOINT: arip-minio
      MINIO_PORT: "9000"
      NODE_RED_BASE_URL: http://arip-nodered:1880
    depends_on:
      arip-postgres:
        condition: service_healthy
      arip-redis:
        condition: service_healthy
      arip-mosquitto:
        condition: service_started
    networks:
      - arip-net
    restart: unless-stopped

volumes:
  arip-postgres-data:
  arip-redis-data:
  arip-mosquitto-data:
  arip-mosquitto-logs:
  arip-minio-data:

networks:
  arip-net:
    driver: bridge
