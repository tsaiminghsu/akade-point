[project]
name = "vehicle-companion"
version = "0.2.0"
description = "Raspberry Pi companion: MAVLink flight controller <-> Akade IoT Control Center (HTTPS, optional AWS IoT MQTT, direct WebSocket link for the web ground station)."
requires-python = ">=3.11"
dependencies = [
  "pymavlink>=2.4.41",
  "aiohttp>=3.9",
  "paho-mqtt>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vehicle_companion*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
