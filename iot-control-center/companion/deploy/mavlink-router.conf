# mavlink-router configuration for a Raspberry Pi companion:
#   /etc/mavlink-router/main.conf
#
# mavlink-router owns the flight controller's serial port and fans MAVLink out
# to every endpoint below. The companion is one endpoint; Mission Planner or
# QGroundControl can connect at the same time for calibration, firmware and
# log download.

[General]
# Mission Planner / QGC: "TCP" to <pi-ip>:5760.
TcpServerPort = 5760
ReportStats = false
MavlinkDialect = auto

# Pixhawk TELEM2 on the Pi's GPIO UART. Set SERIAL2_PROTOCOL = 2 (MAVLink2)
# and SERIAL2_BAUD = 921 on the flight controller to match.
[UartEndpoint autopilot]
Device = /dev/serial0
Baud = 921600

# The companion. Normal mode: the router sends to this address, where the
# companion listens with mavlink_url = "udpin:127.0.0.1:14540". (Server mode
# would wait for the companion to talk first, which it may never do with
# gcs_heartbeat = "off".)
[UdpEndpoint companion]
Mode = Normal
Address = 127.0.0.1
Port = 14540

# Mission Planner / QGC over UDP: connect "UDP" to <pi-ip>:14550.
[UdpEndpoint gcs]
Mode = Server
Address = 0.0.0.0
Port = 14550
