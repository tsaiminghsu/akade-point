<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" width="760" height="324" role="img" aria-label="範本 6　門市的一天：開店檢查、有事才處理、收店留紀錄" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif">
<defs>
