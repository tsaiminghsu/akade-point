[project]
name = "vehicle-companion"
version = "0.1.0"
description = "Raspberry Pi companion bridge: MAVLink <-> Akade IoT Control Center (HTTPS + optional AWS IoT MQTT), with UDP fan-out for MissionPlanner."
requires-python = ">=3.11"
dependencies = [
  "pymavlink>=2.4.40",
  "paho-mqtt>=2.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vehicle_companion"]
